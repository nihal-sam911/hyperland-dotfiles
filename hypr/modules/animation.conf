# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    
    bezier = myBezier, 0.5, 0.9, 0.1, 1.05

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    myBezier
    animation = border,        1,     5.39,  myBezier
    animation = windows,       1,     6,     myBezier
    animation = windowsIn,     1,     3.5,   myBezier, popin 80%
    animation = windowsOut,    1,     3,   myBezier, slide
    animation = fadeIn,        1,     1.80,  myBezier
    animation = fadeOut,       1,     1.5,   myBezier
    animation = fade,          1,     3.03,  myBezier
    animation = layers,        1,     3.81,  myBezier
    animation = layersIn,      1,     4,     myBezier, slide
    animation = layersOut,     1,     4,     myBezier, slide
    animation = fadeLayersIn,  1,     1.8,   myBezier
    animation = fadeLayersOut, 1,     2,     myBezier
    animation = workspaces,    1,     4,     myBezier, 
    animation = workspacesIn,  1,     4,     myBezier, slide 
    animation = workspacesOut, 1,     4,     myBezier, slide 
    animation = zoomFactor,    1,     7,     myBezier
   
}
